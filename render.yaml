# Prepared deployment; provisioning creates paid resources. Review pricing first.
services:
  - type: web
    name: drop-it
    runtime: node
    branch: main
    region: ohio
    plan: 0.5c-512mb
    numInstances: 1
    autoDeployTrigger: off
    buildCommand: npm ci --include=dev && npm run build
    startCommand: node --import tsx server/index.ts
    healthCheckPath: /ready
    domains:
      - dontdropit.app
    envVars:
      - key: NODE_VERSION
        value: 24
      - key: NODE_ENV
        value: production
      - key: PUBLIC_URL
        value: https://dontdropit.app
      - key: PUBLIC_SUPPORT_EMAIL
        value: info@macdigital.ai
      - key: PUBLIC_PUBLISHER_NAME
        value: Mac Digital AI
      - key: BACKUP_RETENTION_DAYS
        value: "7"
      - key: DATABASE_URL
        fromDatabase:
          name: drop-it-db
          property: connectionString
      - key: ACCOUNT_MODE
        value: public
      - key: ALLOW_SIGNUP
        value: "false"
      - key: TRUST_PROXY_HOPS
        value: "1"
      - key: OPENAI_API_KEY
        sync: false
      - key: OAUTH_REDIRECT_URIS
        value: https://chatgpt.com/connector/oauth/yoxjmeygvTeh
databases:
  - name: drop-it-db
    region: ohio
    plan: 0.1c-256mb
    diskSizeGB: 5
    postgresMajorVersion: "16"
    ipAllowList: []
    storageAutoscalingEnabled: false
